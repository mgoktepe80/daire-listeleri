<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Telefonda "ana ekrana ekle" ile tam ekran açılsın -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Daire Listeleri">
    <meta name="theme-color" content="#f3f4f6">
    <!-- Tarayıcı bu dosyayı önbelleğe almasın: yeni sürüm her açılışta gelsin -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Daire Seçim Listeleri</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel kaldırıldı: JSX yayından önce derlendi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Tailwind yayından önce derlendi, aşağıda gömülü -->
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Google Drive API -->
    <script src="https://apis.google.com/js/api.js"></script>
    
    <style>
        /* Miktar alanlarındaki artır/azalt oklarını kaldır */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
            appearance: textfield;
        }
    </style>
    <style>
        /* ===== TELEFON / TABLET (dokunmatik) DÜZENLEMELERİ =====
           Yalnızca dar ekran + dokunmatik cihazlarda geçerli.
           Masaüstünde pencere daraltılsa bile hiçbir şey değişmez. */
        @media (max-width: 1023px) and (pointer: coarse) {
            /* Parmakla rahat basılacak boyut */
            button, select, input[type="text"], input[type="number"], input[type="email"], input[type="password"] {
                min-height: 44px;
            }
            /* iOS'ta 16px altındaki alanlar odaklanınca sayfayı yakınlaştırıyor */
            input, select, textarea { font-size: 16px !important; }

            /* Pencereler tam ekran açılsın (ortalanmış küçük diyalog yerine) */
            .fixed.inset-0 { padding: 0 !important; }
            .fixed.inset-0 > div:not(.mobil-serbest) {
                width: 100% !important;
                max-width: 100% !important;
                height: 100% !important;
                max-height: 100% !important;
                border-radius: 0 !important;
            }
            /* Alt sekme çubuğunun altında içerik kalmasın */
            .mobil-alt-bosluk { padding-bottom: 76px; }
        }
        /* Alt sekme çubuğu — yalnız dar ekranda görünür */
        .mobil-sekme-cubugu { display: none; }
        @media (max-width: 1023px) {
            .mobil-sekme-cubugu { display: flex; }
        }
    </style>
    <style id="theme-style">
        /* Dropdown option'ları için tema stilleri */
        select option {
            background-color: white !important;
            color: #111827 !important;
        }
    </style>
    <script>
        // TEMA — React/Babel yüklenmeden ÖNCE uygulanır.
        // Bu betik olmadan sayfa, uygulama derlenip ilk çizim yapılana kadar
        // (büyük dosyada bu birkaç saniye sürebiliyor) BEYAZ duruyordu.
        (function () {
            try {
                var t = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
                var renk = t === 'dark' ? '#111827' : '#f3f4f6';
                document.documentElement.setAttribute('data-tema', t);
                document.documentElement.style.backgroundColor = renk;
                var govde = function () { if (document.body) document.body.style.backgroundColor = renk; };
                govde();
                document.addEventListener('DOMContentLoaded', govde);
                if (t === 'dark') {
                    var s = document.getElementById('theme-style');
                    if (s) s.innerHTML = 'select option{background-color:#374151!important;color:#f3f4f6!important}';
                }
            } catch (e) {}
        })();
    </script>

const yuklemeMerkezi = {
  dinleyici: null,
  baslik: '',
  toplam: 0,
  sira: 0,
  yayinla(oran) {
    if (!this.dinleyici) return;
    const toplam = this.toplam || 1;
    const tamam = Math.max(0, this.sira - 1) + Math.min(1, Math.max(0, oran || 0));
    this.dinleyici({
      aktif: true,
      baslik: this.baslik,
      sira: this.sira,
      toplam: this.toplam,
      yuzde: Math.min(100, Math.round(tamam / toplam * 100))
    });
  }
};
let yuklemeKapatmaZamani = null;
const yuklemeZamaniniIptalEt = () => {
  if (yuklemeKapatmaZamani) {
    clearTimeout(yuklemeKapatmaZamani);
    yuklemeKapatmaZamani = null;
  }
};
const yuklemeBaslat = (baslik, toplam) => {
  yuklemeZamaniniIptalEt();
  yuklemeMerkezi.baslik = baslik || 'Yükleniyor';
  yuklemeMerkezi.toplam = toplam || 1;
  yuklemeMerkezi.sira = 0;
  yuklemeMerkezi.yayinla(0);
};
const yuklemeSonraki = () => {
  yuklemeMerkezi.sira++;
  yuklemeMerkezi.yayinla(0);
};
const yuklemeIlerle = oran => yuklemeMerkezi.yayinla(oran);
const yuklemeAsama = (baslik, yuzde) => {
  yuklemeZamaniniIptalEt();
  yuklemeMerkezi.baslik = baslik || 'İşleniyor';
  if (yuklemeMerkezi.dinleyici) {
    yuklemeMerkezi.dinleyici({
      aktif: true,
      baslik: yuklemeMerkezi.baslik,
      sira: 0,
      toplam: 0,
      yuzde: Math.min(100, Math.max(0, Math.round(yuzde || 0)))
    });
  }
};
const yuklemeBitir = () => {
  const sonBaslik = yuklemeMerkezi.baslik;
  yuklemeMerkezi.toplam = 0;
  yuklemeMerkezi.sira = 0;
  yuklemeMerkezi.baslik = '';
  if (!yuklemeMerkezi.dinleyici) return;
  yuklemeMerkezi.dinleyici({
    aktif: true,
    baslik: sonBaslik || 'Tamamlandı',
    sira: 0,
    toplam: 0,
    yuzde: 100
  });
  yuklemeZamaniniIptalEt();
  yuklemeKapatmaZamani = setTimeout(() => {
    yuklemeKapatmaZamani = null;
    if (yuklemeMerkezi.dinleyici) {
      yuklemeMerkezi.dinleyici({
        aktif: false,
        baslik: '',
        sira: 0,
        toplam: 0,
        yuzde: 0
      });
    }
  }, 900);
};
const ilerlemeliYukle = (storageRef, blob, meta) => new Promise((resolve, reject) => {
  let gorev;
  try {
    gorev = storageRef.put(blob, meta);
  } catch (e) {
    reject(e);
    return;
  }
  if (!gorev || typeof gorev.on !== 'function') {
    Promise.resolve(gorev).then(resolve, reject);
    return;
  }
  gorev.on('state_changed', anlik => {
    if (anlik && anlik.totalBytes) {
      yuklemeIlerle(anlik.bytesTransferred / anlik.totalBytes);
    }
  }, hata => reject(hata), () => {
    yuklemeIlerle(1);
    resolve();
  });
});
const yuklemeKapsami = baslik => {
  const tekil = yuklemeMerkezi.toplam === 0;
  if (tekil) yuklemeBaslat(baslik, 1);

  return {

    kapat: () => {
      if (tekil) yuklemeBitir();
    }
  };
};
const uploadPhotoToStorage = async (base64Data, userId, projectId, apartmentId, roomId, photoIndex) => {
  if (!storage || !auth || !auth.currentUser) {
    console.log('⚠️ Storage kullanılamıyor, base64 olarak kaydediliyor');
    return base64Data;
  }
  try {
    const response = await fetch(base64Data);
    const blob = await response.blob();
    const benzersiz = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    const path = `users/${userId}/photos/${projectId}/${apartmentId}/${roomId}/${benzersiz}.jpg`;
    const storageRef = storage.ref(path);
    const kapsam = yuklemeKapsami('Fotoğraf yükleniyor');

        contentType: 'image/jpeg',
        cacheControl: 'public, max-age=31536000'

const compressImage = async (base64Data, maxWidth = 800, quality = 0.5) => {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let width = img.width;
      let height = img.height;
      if (width > maxWidth) {
        height = height * maxWidth / width;
        width = maxWidth;
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      const compressed = canvas.toDataURL('image/jpeg', quality);
      const originalSize = (base64Data.length / 1024).toFixed(0);
      const compressedSize = (compressed.length / 1024).toFixed(0);
      console.log(`🗜️ Sıkıştırma: ${originalSize}KB → ${compressedSize}KB (%${Math.round((1 - compressed.length / base64Data.length) * 100)} azalma)`);
      resolve(compressed);
    };
    img.src = base64Data;
  });
};
